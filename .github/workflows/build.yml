name: Build Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Dylib
      run: |
        # Check if main.m exists
        if [ ! -f "main.m" ]; then
          echo "main.m file not found!"
          exit 1
        fi

        # Compile the iOS dylib
        echo "Compiling main.m..."
        clang -dynamiclib \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -arch arm64 \
          -miphoneos-version-min=14.0 \
          -framework Foundation \
          -framework UIKit \
          -o libhook.dylib main.m

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dylib-file
        path: libhook.dylib
